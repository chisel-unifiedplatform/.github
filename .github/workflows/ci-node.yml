name: CI (Node)

# Reusable PR checks for Node / TypeScript projects. Call it from a repo's
# .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: chisel-unifiedplatform/.github/.github/workflows/ci-node.yml@<full-commit-sha>
#       with:
#         typecheck-command: npx tsc --noEmit
#         test-command: npm test -- --ci
#
# Installs with the repo's lockfile (bun, pnpm, yarn or npm; bun wins when bun.lock exists), then runs each command
# that isn't empty: typecheck, lint, test, build. Read-only token, no secrets.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      working-directory:
        type: string
        default: "."
      typecheck-command:
        type: string
        default: ""
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""
      env:
        description: "KEY=value lines exported for every step (no secrets)"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Package manager
        id: pm
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then echo "pm=bun" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
      - if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: steps.pm.outputs.pm == 'bun' || (steps.pm.outputs.pm == 'npm' && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) == '')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - if: steps.pm.outputs.pm != 'bun' && !(steps.pm.outputs.pm == 'npm' && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) == '')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.pm == 'pnpm' && 'pnpm-lock.yaml' || steps.pm.outputs.pm == 'yarn' && 'yarn.lock' || 'package-lock.json' }}
      - name: Environment
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: printf '%s\n' "$EXTRA_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV"
      - name: Install
        env:
          HUSKY: "0"
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            bun) bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi ;;
          esac
      - name: Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}
      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
